name: cml-report

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  train-smoke-matrix:
    # skip the push triggered by the README auto-commit below
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    # NOTE: the ghcr.io/iterative/cml container ships Python 3.8, too old for
    # our pins (pandas/torch/timm) - use a plain runner + setup actions instead
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: metrics diffs + push back to master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: iterative/setup-cml@v2

      - run: pip install -r requirements-train.txt

      - name: Cache DVC data
        uses: actions/cache@v4
        with:
          path: .dvc/cache
          key: dvc-data-${{ hashFiles('data/raw.dvc', 'data/annotations.dvc') }}

      - name: Pull data
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          echo "$GDRIVE_SA_JSON" > sa.json
          dvc remote modify --local storage gdrive_use_service_account true
          dvc remote modify --local storage gdrive_service_account_json_file_path sa.json
          # Drive throttles bulk API downloads (transient SSL EOFs) - retry;
          # after the first green run the cache step above skips the download
          ok=0
          for i in 1 2 3 4 5; do
            dvc pull -j 4 data/raw.dvc data/annotations.dvc && { ok=1; break; }
            echo "pull attempt $i failed - retrying in 30s"
            sleep 30
          done
          [ "$ok" = "1" ]

      - name: Data stages
        run: dvc repro validate prepare_split crop_classification

      - name: Smoke train detection (all 4 configs)
        run: |
          for model in yolo12n yolo26n; do
            for variant in 11 22; do
              python scripts/train_detection.py --model $model --variant $variant --smoke
            done
          done

      - name: Smoke train classifiers (Approach B stage 2)
        run: |
          for model in dinov2 efficientnet swin; do
            python scripts/train_classifier.py --model $model --smoke
          done

      - name: Build report
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path

          lines = ["## Smoke Metrics (1 epoch, 5% data — plumbing check)", ""]
          lines += ["| model | classes | run | mAP50 | mAP50-95 | precision | recall |",
                    "|---|---|---|---|---|---|---|"]
          runs = []
          for p in sorted(Path("reports").glob("metrics_*.json")):
              m = json.loads(p.read_text(encoding="utf-8"))
              if "variant" not in m:   # classifier metrics: separate table below
                  continue
              runs.append(m)
              # smoke rows come from this CI run; full rows are committed results
              m["_run"] = "smoke" if m.get("smoke") else "full (committed)"
              lines.append("| {model} | {variant} | {_run} | {mAP50} | {mAP50_95} "
                           "| {precision} | {recall} |".format(**m))
          lines.append("")
          lines.append("> Note: variant-22 mAP is not directly comparable to variant-11 mAP (different class sets). It is included as reference only; the real Approach A vs B comparison happens after the classifier stage.")
          for m in runs:   # detection figure dropdowns belong under the detection table
              figdir = Path("reports/figures") / f"{m['model']}_{m['variant']}"
              imgs = [("Training curves", "results.png"),
                      ("Confusion matrix (normalized)", "confusion_matrix_normalized.png"),
                      ("Sample predictions", "val_batch0_pred.jpg")]
              existing = [(t, figdir / n) for t, n in imgs if (figdir / n).is_file()]
              if not existing:
                  continue
              lines += ["", f"<details><summary><b>{m['model']} — {m['variant']} classes</b></summary>", ""]
              for title, path in existing:
                  lines += [f"### {title}", f"![{title}]({path.as_posix()})", ""]
              lines.append("</details>")
          cls_runs = [json.loads(p.read_text(encoding="utf-8"))
                      for p in sorted(Path("reports").glob("metrics_cls_*.json"))]
          if cls_runs:
              lines += ["", "## Classifier Smoke (Approach B stage 2 — damaged/undamaged)", "",
                        "| model | backbone | accuracy | precision | recall | F1 |",
                        "|---|---|---|---|---|---|"]
              for m in cls_runs:
                  lines.append("| {model} | {backbone} | {accuracy} | {precision_damaged} "
                               "| {recall_damaged} | {f1_damaged} |".format(**m))
              for m in cls_runs:
                  figdir = Path("reports/figures") / f"cls_{m['model']}"
                  imgs = [("Training curves", "results.png"),
                          ("Confusion matrix (best epoch)", "confusion_matrix.png")]
                  existing = [(t, figdir / n) for t, n in imgs if (figdir / n).is_file()]
                  if not existing:
                      continue
                  lines += ["", f"<details><summary><b>classifier: {m['model']}</b></summary>", ""]
                  for title, path in existing:
                      lines += [f"### {title}", f"![{title}]({path.as_posix()})", ""]
                  lines.append("</details>")
          Path("report.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("report.md written")
          EOF

      - name: Publish report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cml comment create --publish report.md

      - name: Refresh README Latest Results
        if: github.event_name == 'push'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # the smoke runs above overwrote reports/ in this workspace - restore
          # the COMMITTED full-run metrics before regenerating the README table
          git checkout -- reports/
          python scripts/update_readme_results.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # stage first: `git diff --quiet` exits 0 for an UNTRACKED README
          git add README.md
          if ! git diff --cached --quiet -- README.md; then
            git commit -m "docs: refresh Latest Results [skip ci]"
            # smoke runs leave tracked files (dvc.lock, reports/) modified in
            # this throwaway workspace - discard them or the rebase refuses
            git checkout -- .
            git pull --rebase origin master
            git push
          fi
