name: cml-report
on: [pull_request]
jobs:
  train-smoke:
    runs-on: ubuntu-latest
    container: ghcr.io/iterative/cml:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # dvc metrics diff master needs the master ref
      - run: pip install -r requirements-train.txt
      - name: Pull data
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          echo "$GDRIVE_SA_JSON" > sa.json
          dvc remote modify --local storage gdrive_use_service_account true
          dvc remote modify --local storage gdrive_service_account_json_file_path sa.json
          dvc pull
      - name: Repro + report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dvc repro
          echo "## Smoke Metrics" > report.md
          dvc metrics diff master --md >> report.md
          for d in runs_smoke/*/; do
            m=$(basename "$d")
            {
              echo "<details><summary><b>$m</b> — curves, confusion matrix, predictions</summary>"
              echo ""
              echo "### Training curves"
              echo "![curves](runs_smoke/$m/results.png)"
              echo "### Confusion matrix (normalized)"
              echo "![confusion](runs_smoke/$m/confusion_matrix_normalized.png)"
              echo "### Sample predictions vs ground truth"
              echo "| ground truth | prediction |"
              echo "|---|---|"
              echo "| ![gt](runs_smoke/$m/val_batch0_labels.jpg) | ![pred](runs_smoke/$m/val_batch0_pred.jpg) |"
              echo ""
              echo "</details>"
            } >> report.md
          done
          cml comment create --publish report.md